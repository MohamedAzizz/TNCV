spring.application.name=user-service

server.port=8082

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}


# ============================================================
# PostgreSQL - USER SERVICE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/tncv_user_db
spring.datasource.username=postgres
spring.datasource.password=14373675
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# Server
# ============================================================

server.error.include-message=always


# ============================================================
# Keycloak - JWT validation
# ============================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/tncv


# ============================================================
# Keycloak Admin Client
# ============================================================

keycloak.server-url=http://localhost:8181
keycloak.realm=tncv
keycloak.client-id=tncv-backend
keycloak.client-secret=3TEdxh0MG4CHvhe9eblYy80znadrZyVp