spring.application.name=user-service

server.port=8082

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}


# ============================================================
# PostgreSQL - USER SERVICE
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tncv_user_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:14373675}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# Server
# ============================================================

server.error.include-message=always


# ============================================================
# Keycloak - JWT validation (Resource Server)
# ============================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/tncv}


# ============================================================
# Keycloak Admin Client (pour créer/supprimer des utilisateurs)
# ============================================================

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8181}
keycloak.realm=${KEYCLOAK_REALM:tncv}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:tncv-backend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:3TEdxh0MG4CHvhe9eblYy80znadrZyVp}


# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always