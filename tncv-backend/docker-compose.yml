services:

  # ==========================================
  # PostgreSQL - TNCV
  # Script d'init : postgres/init/init.sql
  # Crée tncv_user_db et tncv_cv_db
  # ==========================================
  postgres:
    image: postgres:17
    container_name: tncv-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-14373675}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Keycloak
  # Realm "tncv" doit être configuré manuellement
  # ou importé via un fichier realm JSON
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: tncv-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8181:8080"
    restart: unless-stopped


volumes:
  postgres_data: