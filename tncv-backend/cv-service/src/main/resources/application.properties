# ============================================================
# APPLICATION
# ============================================================

spring.application.name=cv-service
server.port=8083

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

# ============================================================
# PostgreSQL - CV SERVICE
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/tncv_cv_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:14373675}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# KEYCLOAK / JWT
# ============================================================

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/tncv}

# ============================================================
# MinIO - CV Storage
# ============================================================

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:admin}
minio.secret-key=${MINIO_ROOT_PASSWORD:admin123}
minio.bucket.cvs=${MINIO_BUCKET_CVS:tncv-cvs}

# ============================================================
# File Upload Limits
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Max CV file size in bytes (10 MB = 10485760)
tncv.cv-file.max-size-bytes=10485760

# ============================================================
# Server
# ============================================================

server.error.include-message=always