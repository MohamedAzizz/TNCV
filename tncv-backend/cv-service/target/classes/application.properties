# ============================================================
# APPLICATION
# ============================================================

spring.application.name=cv-service
server.port=8083

# ============================================================
# Eureka
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=localhost:${spring.application.name}:${server.port}

# ============================================================
# PostgreSQL - USER SERVICE
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/tncv_cv_db
spring.datasource.username=postgres
spring.datasource.password=14373675
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect




# ============================================================
# ACTUATOR
# ============================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always